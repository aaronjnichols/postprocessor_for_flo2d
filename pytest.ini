[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-exclude=tests/*
    --cov-exclude=gui/*
    --cov-exclude=setup.py
markers =
    unit: Unit tests
    integration: Integration tests  
    slow: Slow running tests
    data_validation: Data validation tests